name: Build external index

# Hourly rebuild: the Optimus bot's external index TTL is ~1 hour, so it
# picks up fresh data within about an hour of a rebuild.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: python3 -m pytest tests/ -q
      - name: Build index
        run: python3 build.py
      - name: Commit regenerated manifest
        # build.py re-reads the Master Links doc every run and rewrites
        # sources.json; commit it (and the fresh index) back so the repo
        # manifest stays in sync with the doc. No push trigger on this
        # workflow, so the commit cannot loop.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sources.json external-index.json
          git diff --cached --quiet || git commit -m "Sync sources.json from the Master Links doc"
          git push
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
